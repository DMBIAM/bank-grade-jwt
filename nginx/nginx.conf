# =============================================================================
# nginx.conf
#
# Reverse proxy de la arquitectura Bank-Grade JWT.
#
# Actúa como punto de entrada único (edge) frente al cliente, redirigiendo
# todo el tráfico HTTP hacia la API de Node.js/Express (servicio "api" en
# Docker Compose). No realiza terminación TLS ni lógica de negocio: su
# única responsabilidad es el enrutamiento y la propagación correcta de
# los headers necesarios para que la API identifique el origen real de
# cada petición.
# =============================================================================

# El bloque "events" es obligatorio en toda configuración de Nginx.
# Controla el modelo de conexiones a nivel de worker (conexiones
# simultáneas, mecanismo de polling, etc.). Se deja vacío para utilizar
# los valores por defecto de Nginx, suficientes para este laboratorio.
events {}

http {

    # -------------------------------------------------------------------
    # Upstream: bank_api
    #
    # Define el grupo de servidores backend hacia los que Nginx
    # distribuye las peticiones. Aquí contiene un único servidor: el
    # servicio "api" definido en docker-compose.yml, resuelto por el
    # DNS interno de Docker, escuchando en el puerto 3000 (el mismo
    # puerto configurado en env.js / PORT).
    #
    # Con un solo servidor no hay balanceo de carga real, pero definir
    # un upstream deja la configuración lista para escalar a múltiples
    # instancias de la API sin cambiar la lógica de proxy_pass.
    # -------------------------------------------------------------------
    upstream bank_api {
        server api:3000;
    }

    # -------------------------------------------------------------------
    # Server block: punto de entrada HTTP
    #
    # Escucha en el puerto 80 y acepta peticiones para cualquier
    # server_name (server_name "_" actúa como bloque catch-all).
    # -------------------------------------------------------------------
    server {

        # Puerto de escucha del proxy. Es el puerto expuesto al exterior
        # del contenedor Nginx (ver mapeo de puertos en docker-compose.yml).
        listen 80;

        # server_name "_" indica que este bloque responde a cualquier
        # nombre de host que llegue a este puerto, ya que no se está
        # enrutando por múltiples dominios/vhosts en este laboratorio.
        server_name _;

        # ---------------------------------------------------------------
        # location /
        #
        # Redirige todas las rutas (incluyendo /api/auth/*,
        # /api/protected, /health, etc.) hacia el upstream "bank_api".
        # La API es la responsable de resolver el enrutamiento interno
        # (ver src/app.js, auth.routes.js, protected.routes.js).
        # ---------------------------------------------------------------
        location / {

            # Reenvía la petición al upstream definido arriba.
            proxy_pass http://bank_api;

            # Fuerza HTTP/1.1 en la conexión hacia el backend. Es
            # requerido para soportar correctamente keep-alive y, en
            # general, es la versión recomendada para proxies inversos
            # frente a aplicaciones Node.js/Express.
            proxy_http_version 1.1;

            # Preserva el header "Host" original de la petición del
            # cliente en lugar de sobrescribirlo con el nombre del
            # upstream. Permite que la API conozca el host solicitado.
            proxy_set_header Host $host;

            # Informa a la API la dirección IP real del cliente que
            # originó la petición, ya que de lo contrario la API vería
            # siempre la IP interna de Nginx como origen.
            proxy_set_header X-Real-IP $remote_addr;

            # Encadena la IP del cliente (y de cualquier proxy
            # intermedio previo) en el header estándar X-Forwarded-For,
            # útil para trazabilidad y auditoría de accesos.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Informa a la API el esquema original de la petición
            # (http o https). Es relevante si en el futuro se agrega
            # terminación TLS delante de este proxy, para que la API
            # pueda distinguir tráfico cifrado del no cifrado.
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}